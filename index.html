<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.pumpkin.min.css"
>
<main class="container">
    <h1>JS 3D renderer</h1>
    <div class="grid">
        <div>X <input id="x" type="range" min="-1" max="1" step="0.01" value="0"/></div>
        <div>Y <input id="y" type="range" min="-1" max="1" step="0.01" value="-0.1"/></div>
        <div>Z <input id="z" type="range" min="-3" max="3" step="0.01" value="0.2"/></div>
    </div>
    <canvas id="scene" width="800px" height="800px"></canvas>
    <script src="models/boot.js"></script>
    <script src="script.js"></script>
</main>
